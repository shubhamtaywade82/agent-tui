name: docker

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.supervisor'
      - 'Dockerfile.sandbox'
      - 'docker-compose.yml'
      - 'src/supervisor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.supervisor'
      - 'Dockerfile.sandbox'
      - 'docker-compose.yml'

# Builds both Docker images on every push to main and on PRs that touch
# Docker-related files. On main, tags are pushed to ghcr.io; on PRs,
# images are built but not pushed (smoke test only).

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  SUPERVISOR_IMAGE: ghcr.io/${{ github.repository }}/minicpm5-supervisor
  SANDBOX_IMAGE: ghcr.io/${{ github.repository }}/supervisor-sandbox

jobs:
  build-supervisor:
    name: Build Supervisor Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SUPERVISOR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build supervisor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.supervisor
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true  # load into docker for the smoke test

      - name: Smoke test supervisor image
        run: |
          # Use the first tag from metadata (always present, even on PRs)
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "Testing image: ${IMAGE_TAG}"
          # Override entrypoint (tini) to run a simple node command
          docker run --rm --entrypoint node "${IMAGE_TAG}" -e "console.log('supervisor image OK')"
          # Verify the image has tsx + tini
          docker run --rm --entrypoint sh "${IMAGE_TAG}" -c 'which tsx && which tini && echo "entrypoint tools OK"'

  build-sandbox:
    name: Build Sandbox Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SANDBOX_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test sandbox image
        run: |
          # Use the first tag from metadata (always present, even on PRs)
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "Testing image: ${IMAGE_TAG}"
          docker run --rm "${IMAGE_TAG}" echo "sandbox image OK"
          # Verify required tools are present in the sandbox
          docker run --rm "${IMAGE_TAG}" sh -c '
            which git && which python3 && which rg && which pytest &&
            which ruff && which biome && which tsc &&
            echo "all required sandbox tools present"
          '
          # Verify the sandbox runs as non-root user
          docker run --rm "${IMAGE_TAG}" sh -c 'whoami | grep -q sandbox && echo "runs as sandbox user OK"'

  compose-up:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [build-supervisor, build-sandbox]
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

      - name: Verify all referenced images exist in compose
        run: |
          # Check that all images referenced in compose are valid
          docker compose config --images | while read img; do
            echo "Image: $img"
          done

      - name: Verify compose service names
        run: |
          for svc in postgres redis minio ollama sandbox supervisor; do
            docker compose config --services | grep -q "$svc" || {
              echo "::error::Missing service: $svc"
              exit 1
            }
          done
          echo "All required services present in docker-compose.yml"
