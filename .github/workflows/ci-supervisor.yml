name: supervisor-ci

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'src/supervisor/**'
      - 'test/supervisor/**'
      - 'supervisor/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'biome.json'
      - 'docker-compose.yml'
      - 'Dockerfile.supervisor'
      - 'Dockerfile.sandbox'
      - '.github/workflows/ci-supervisor.yml'
      - '.github/workflows/modelfiles.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/supervisor/**'
      - 'test/supervisor/**'
      - 'supervisor/**'

concurrency:
  group: supervisor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx biome check src/supervisor test/supervisor
      - run: npx tsc --noEmit

  modelfile-validation:
    name: Modelfile Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 4 Modelfiles exist
        run: |
          for mf in router toolagent analyst summarizer; do
            test -f "supervisor/modelfiles/${mf}.Modelfile" || {
              echo "ERROR: supervisor/modelfiles/${mf}.Modelfile not found"
              exit 1
            }
          done
          echo "All 4 Modelfiles present."
      - name: Verify FROM base image
        run: |
          for mf in supervisor/modelfiles/*.Modelfile; do
            grep -q '^FROM openbmb/minicpm5-2b' "$mf" || {
              echo "ERROR: $mf does not use FROM openbmb/minicpm5-2b"
              exit 1
            }
          done
      - name: Verify temperature constraints (I4)
        run: |
          # router ≤ 0.1, toolagent ≤ 0.2, analyst ≤ 0.3, summarizer ≤ 0.3
          grep -q '^PARAMETER temperature 0\.\(0\|1\)$' supervisor/modelfiles/router.Modelfile || {
            echo "ERROR: router temperature must be ≤ 0.1"; exit 1
          }
          grep -q '^PARAMETER temperature 0\.\(0\|1\|2\)$' supervisor/modelfiles/toolagent.Modelfile || {
            echo "ERROR: toolagent temperature must be ≤ 0.2"; exit 1
          }
          grep -q '^PARAMETER temperature 0\.\(0\|1\|2\|3\)$' supervisor/modelfiles/analyst.Modelfile || {
            echo "ERROR: analyst temperature must be ≤ 0.3"; exit 1
          }
          grep -q '^PARAMETER temperature 0\.\(0\|1\|2\|3\)$' supervisor/modelfiles/summarizer.Modelfile || {
            echo "ERROR: summarizer temperature must be ≤ 0.3"; exit 1
          }
          echo "All temperature constraints satisfied."
      - name: Verify num_ctx constraints
        run: |
          # router ≥ 2048, others ≥ 8192
          ctx=$(grep '^PARAMETER num_ctx' supervisor/modelfiles/router.Modelfile | awk '{print $3}')
          [ "$ctx" -ge 2048 ] || { echo "ERROR: router num_ctx must be ≥ 2048 (got $ctx)"; exit 1; }
          for mf in toolagent analyst summarizer; do
            ctx=$(grep '^PARAMETER num_ctx' "supervisor/modelfiles/${mf}.Modelfile" | awk '{print $3}')
            [ "$ctx" -ge 8192 ] || { echo "ERROR: ${mf} num_ctx must be ≥ 8192 (got $ctx)"; exit 1; }
          done
          echo "All num_ctx constraints satisfied."
      - name: Verify PARAMETER stop sequences (I6)
        run: |
          # toolagent + analyst + summarizer must have stop sequences
          for mf in toolagent analyst summarizer; do
            grep -q '^PARAMETER stop' "supervisor/modelfiles/${mf}.Modelfile" || {
              echo "ERROR: ${mf}.Modelfile missing PARAMETER stop"; exit 1
            }
          done
          echo "All required stop sequences present."
      - name: Verify SYSTEM prompt present + non-empty
        run: |
          for mf in supervisor/modelfiles/*.Modelfile; do
            grep -q '^SYSTEM """' "$mf" || {
              echo "ERROR: $mf missing SYSTEM prompt"; exit 1
            }
            # Extract text between SYSTEM """ and closing """
            content=$(sed -n '/^SYSTEM """/,/^"""$/p' "$mf" | head -n -1 | tail -n +2 | tr -d '[:space:]')
            [ -n "$content" ] || { echo "ERROR: $mf has empty SYSTEM prompt"; exit 1; }
          done
          echo "All SYSTEM prompts present and non-empty."

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck, modelfile-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run test/supervisor/unit --coverage
        env:
          INFERENCE_BACKEND: mock
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7
      - run: npx vitest run test/supervisor/evals
        env:
          INFERENCE_BACKEND: mock

  integration-tests:
    name: Integration Tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supervisor
          POSTGRES_PASSWORD: supervisor
          POSTGRES_DB: supervisor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supervisor -d supervisor_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run test/supervisor/integration
        env:
          INFERENCE_BACKEND: mock
          TEST_DATABASE_URL: postgres://supervisor:supervisor@localhost:5432/supervisor_test
        timeout-minutes: 10

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-typecheck, modelfile-validation]
    steps:
      - uses: actions/checkout@v4
      - name: Build supervisor image
        run: docker build -f Dockerfile.supervisor -t minicpm5-supervisor:ci .
      - name: Build sandbox image
        run: docker build -f Dockerfile.sandbox -t supervisor-sandbox:ci .
      - name: Smoke test supervisor image
        run: |
          # Override entrypoint (tini) to run a simple node command
          docker run --rm --entrypoint node minicpm5-supervisor:ci -e "console.log('supervisor image OK')"
      - name: Smoke test sandbox image
        run: docker run --rm supervisor-sandbox:ci echo "sandbox image OK"
      - name: Verify sandbox has required tools
        run: |
          docker run --rm supervisor-sandbox:ci sh -c '
            which git && which python3 && which rg && which pytest &&
            which ruff && echo "all required sandbox tools present"
          '

  invariant-check:
    name: Invariant Verification (I1-I8)
    runs-on: ubuntu-latest
    needs: [lint-typecheck, modelfile-validation]
    steps:
      - uses: actions/checkout@v4
      - name: I1 — Supervisor imports zero concrete adapters
        run: |
          if grep -qE 'import.*(HybridRetriever|SandboxExecutor|PgStateStore|OllamaBackend)' src/supervisor/engine.ts; then
            echo "FAIL: engine.ts imports concrete adapters"
            grep -nE 'import.*(HybridRetriever|SandboxExecutor|PgStateStore|OllamaBackend)' src/supervisor/engine.ts
            exit 1
          fi
          echo "I1 PASS"
      - name: I2 — Every LLM JSON output crosses Zod
        run: |
          # Verify safeParse or .parse is called on backend.invoke results
          grep -q 'safeParse\|\.parse(' src/supervisor/router/classifier.ts
          grep -q 'safeParse\|\.parse(' src/supervisor/engine.ts
          echo "I2 PASS"
      - name: I3 — readonly on runId, query, createdAt, errorTrace
        run: |
          for field in runId objective createdAt query errorTrace; do
            grep -q "${field}.*\.readonly()" src/supervisor/state/models.ts || {
              echo "FAIL: ${field} is not .readonly()"; exit 1
            }
          done
          echo "I3 PASS"
      - name: I4 — Router temperature ≤ 0.1 in Modelfile
        run: |
          temp=$(grep '^PARAMETER temperature' supervisor/modelfiles/router.Modelfile | awk '{print $3}')
          awk "BEGIN {exit !($temp <= 0.1)}" || { echo "FAIL: router temp $temp > 0.1"; exit 1; }
          echo "I4 PASS"
      - name: I5 — Sandbox allowlist non-empty
        run: |
          count=$(grep -c 'DEFAULT_ALLOWLIST' src/supervisor/sandbox/policy.ts)
          [ "$count" -ge 1 ] || { echo "FAIL: no DEFAULT_ALLOWLIST"; exit 1; }
          echo "I5 PASS"
      - name: I6 — At least one Modelfile has PARAMETER stop
        run: |
          count=$(grep -rl 'PARAMETER stop' supervisor/modelfiles/ | wc -l)
          [ "$count" -ge 1 ] || { echo "FAIL: no Modelfile has PARAMETER stop"; exit 1; }
          echo "I6 PASS (${count} Modelfiles have stops)"
      - name: I7 — No raw JSON.parse without try/catch
        run: |
          # Every JSON.parse in src/supervisor/ must either:
          #   a) be a deep-clone pattern: JSON.parse(JSON.stringify(...))
          #   b) have a try { within 5 lines before it
          for f in $(grep -rl 'JSON\.parse' src/supervisor/); do
            line_nums=$(grep -n 'JSON\.parse' "$f" | cut -d: -f1)
            for ln in $line_nums; do
              # Skip the deep-clone pattern JSON.parse(JSON.stringify(
              if sed -n "${ln}p" "$f" | grep -q 'JSON\.parse(JSON\.stringify'; then
                continue
              fi
              # Check if there's a try { within the 5 lines before this JSON.parse
              start=$((ln - 5))
              [ "$start" -lt 1 ] && start=1
              if ! sed -n "${start},${ln}p" "$f" | grep -q 'try[[:space:]]*{'; then
                echo "FAIL: $f:$ln has JSON.parse without try/catch"
                exit 1
              fi
            done
          done
          echo "I7 PASS"
      - name: I8 — stateStore.save ≥ 2 calls per run
        run: |
          count=$(grep -c 'store\.saveRun' src/supervisor/engine.ts)
          [ "$count" -ge 2 ] || { echo "FAIL: only $count saveRun calls (need ≥ 2)"; exit 1; }
          echo "I8 PASS (${count} saveRun calls)"
